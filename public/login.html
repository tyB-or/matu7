<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matu7 - 登录</title>
  <link rel="stylesheet" href="/css/fontawesome/all.min.css">
  <link rel="stylesheet" href="/css/fontawesome/fontawesome.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <div class="container">
    <div class="screen">
      <div class="screen__content">
        <div class="login-header">
          <h1>Matu7 登录</h1>
        </div>
        <form class="login" id="login-form">
          <div class="login__field">
            <i class="login__icon fas fa-user"></i>
            <input type="text" class="login__input" id="username" placeholder="请输入用户名" required autocomplete="off">
          </div>
          <div class="login__field">
            <i class="login__icon fas fa-lock"></i>
            <input type="password" class="login__input" id="password" placeholder="请输入密码" required autocomplete="off">
          </div>
          <button type="submit" class="button login__submit">
            <span class="button__text">登 录</span>
            <i class="button__icon fas fa-chevron-right"></i>
          </button>
          <div id="error-message" class="error-message"></div>
        </form>
      </div>
      <div class="screen__background">
        <span class="screen__background__shape screen__background__shape4"></span>
        <span class="screen__background__shape screen__background__shape3"></span>
        <span class="screen__background__shape screen__background__shape2"></span>
        <span class="screen__background__shape screen__background__shape1"></span>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // 检查是否已登录
      const token = localStorage.getItem('auth_token');
      if (token) {
        // 已有token，尝试跳转到主页
        window.location.href = '/';
      }
      
      // 登录表单提交处理
      const loginForm = document.getElementById('login-form');
      const errorMessage = document.getElementById('error-message');
      
      loginForm.addEventListener('submit', function(e) {
        e.preventDefault();
        
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;
        
        // 发送登录请求
        fetch('/api/auth/login', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            username: username,
            password: password
          })
        })
        .then(response => {
          if (!response.ok) {
            throw new Error('登录失败');
          }
          return response.json();
        })
        .then(data => {
          // 保存token到本地存储
          localStorage.setItem('auth_token', data.token);
          
          // 跳转到主页
          window.location.href = '/';
        })
        .catch(error => {
          // 显示错误消息
          errorMessage.textContent = '用户名或密码错误，请重试';
          errorMessage.style.display = 'block';
        });
      });
    });
  </script>
</body>
</html>
